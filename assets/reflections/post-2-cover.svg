<!-- the single narrow route: blocked -->
<g transform="translate(760,700)"><rect x="-60" y="-26" width="120" height="52" rx="10" fill="#fff" stroke="#1b2938" stroke-width="3"/><line x1="-36" y1="-6" x2="36" y2="-6" stroke="#c9b9be" stroke-width="3"/><line x1="-36" y1="10" x2="16" y2="10" stroke="#c9b9be" stroke-width="3"/></g>
<path d="M500,540 C560,640 640,690 690,700" fill="none" stroke="#c9b9be" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 14"/>
