<path d="M1340,140 Q1340,160 1360,160 Q1340,160 1340,180 Q1340,160 1320,160 Q1340,160 1340,140Z" fill="#c9a14a"/><path d="M1330,520 Q1330,532 1342,532 Q1330,532 1330,544 Q1330,532 1318,532 Q1330,532 1330,520Z" fill="#A51C30"/>
