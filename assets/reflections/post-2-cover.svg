<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf3f4"/><stop offset=".6" stop-color="#fbe8eb"/><stop offset="1" stop-color="#f6dde2"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A51C30" stop-opacity=".22"/><stop offset="1" stop-color="#A51C30" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="800" fill="url(#bg)"/>
<circle cx="470" cy="400" r="300" fill="#fff" opacity=".55"/>
<circle cx="470" cy="400" r="190" fill="url(#glow)"/>
<!-- the thought: a dense, lively cluster -->
<g stroke="#1b2938" stroke-width="3">
  <circle cx="470" cy="400" r="40" fill="#A51C30" stroke="#A51C30"/>
  <circle cx="400" cy="330" r="20" fill="#f4c6cd"/><circle cx="545" cy="335" r="16" fill="#fff"/>
  <circle cx="380" cy="440" r="15" fill="#fff"/><circle cx="550" cy="465" r="22" fill="#f9dde1"/>
  <circle cx="460" cy="505" r="14" fill="#fff"/><circle cx="470" cy="290" r="12" fill="#f4c6cd"/>
</g>
<g stroke="#c9b9be" stroke-width="3" stroke-linecap="round"><line x1="470" y1="400" x2="400" y2="330"/><line x1="470" y1="400" x2="545" y2="335"/><line x1="470" y1="400" x2="380" y2="440"/><line x1="470" y1="400" x2="550" y2="465"/><line x1="470" y1="400" x2="460" y2="505"/><line x1="470" y1="400" x2="470" y2="290"/></g>
<!-- many open paths to different forms of expression -->
<g fill="none" stroke="#A51C30" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 14">
  <path d="M560,370 C760,250 900,200 1080,200"/>
  <path d="M570,410 C780,400 900,400 1080,400"/>
  <path d="M560,450 C760,560 900,600 1080,600"/>
</g>
<!-- speech -->
<g transform="translate(1110,145)" stroke="#1b2938" stroke-width="3"><path d="M0,10 Q0,0 10,0 H150 Q160,0 160,10 V80 Q160,90 150,90 H50 L28,115 L32,90 H10 Q0,90 0,80Z" fill="#fff"/><line x1="25" y1="32" x2="135" y2="32" stroke="#c9b9be"/><line x1="25" y1="58" x2="105" y2="58" stroke="#c9b9be"/></g>
<!-- drawing / sketch -->
<g transform="translate(1110,340)" stroke="#1b2938" stroke-width="3"><rect width="160" height="120" rx="10" fill="#fff"/><path d="M20,95 L60,50 L90,80 L110,62 L140,95Z" fill="#f4c6cd"/><circle cx="120" cy="35" r="12" fill="#c9a14a" stroke="none"/></g>
<!-- making / building -->
